// Module-level build script for the Gyroscopic Aquarium live wallpaper.
// RenderScript is intentionally NOT enabled — none is required.

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nullevent.aquarium'
    compileSdk 34

    defaultConfig {
        applicationId "com.nullevent.aquarium"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // No Compose, no RenderScript, no view binding — pure GLSurfaceView + GLES30.
    buildFeatures {
        compose false
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // androidx.preference powers the live wallpaper settings screen only.
    implementation 'androidx.preference:preference-ktx:1.2.1'
    // OpenGL ES 3.0 and the WallpaperService come from the Android framework;
    // no external graphics, math, or game-engine libraries are used.
}
